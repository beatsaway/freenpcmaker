<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free NPC Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #1a1714;
    --bg1: #2a231c;
    --ink: #f3ebe0;
    --muted: #a89a88;
    --line: #3d342a;
    --accent: #e8b86d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #4a3a28 0%, transparent 55%),
      linear-gradient(165deg, var(--bg1), var(--bg0));
  }
  .wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px 18px 40px;
  }
  .card {
    width: min(420px, 100%);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: Orbitron, sans-serif;
    font-weight: 800;
    font-size: clamp(1.35rem, 4.5vw, 1.85rem);
    letter-spacing: 0.04em;
  }
  .tag {
    margin: 10px 0 28px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .versions {
    display: grid;
    gap: 12px;
  }
  a.ver {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 18px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(0,0,0,0.28);
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  a.ver:hover, a.ver:focus-visible {
    border-color: var(--accent);
    background: rgba(232, 184, 109, 0.08);
    transform: translateY(-1px);
    outline: none;
  }
  a.ver .name {
    font-family: Orbitron, sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
  }
  a.ver .meta {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  a.ver.latest .name::after {
    content: " · latest";
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .hint {
    margin-top: 22px;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Free NPC Maker</h1>
      <p class="tag">Pick a version — tap to start</p>
      <div class="versions">
        <a class="ver latest" href="./v1.01/">
          <div class="name">v1.01</div>
          <div class="meta">Current build — face seating, neck join, hair skull-safe</div>
        </a>
        <a class="ver" href="./v1.0/">
          <div class="name">v1.0</div>
          <div class="meta">Original push release</div>
        </a>
      </div>
      <p class="hint">Each version opens with its own tap-to-start screen</p>
    </div>
  </div>
</body>
</html>
